<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamScheduleX</title>
</head>

<body>
  <main id="app">
    <!-- 左栏：时钟 + 当前科目 -->
    <section class="pane pane-left" id="pane-left">
      <div class="pane-left__inner">
        <div class="brand">
          <span class="brand__code" data-lang="en">EXAM / SCHEDULE-X</span>
          <span class="brand__date"><span id="date-num">----/--/--</span><span class="lbl-sep"> · </span><span
              data-lang="zh" id="date-week">星期-</span></span>
        </div>
        <div class="clock-block">
          <div class="clock clock-font fit" id="clock" data-fs="clock">--:--:--</div>
        </div>
        <div class="current-card ak-command" id="current-card">
          <span class="ak-command__label"><span data-lang="en">CURRENT</span><span class="lbl-sep"> / </span><span
              data-lang="zh">当前科目</span></span>
          <div class="current-card__name fit" id="current-name" data-fs="current-name">等待课表数据</div>
          <div class="current-card__meta">
            <span class="ak-tag" id="current-tag">STANDBY</span>
            <span class="current-card__range" id="current-range">--</span>
          </div>
          <div class="current-card__count clock-font fit" id="countdown" data-fs="countdown">--:--:--</div>
          <div class="ak-progress current-card__progress" id="current-progress-wrap" hidden>
            <div class="ak-progress__track">
              <div class="ak-progress__fill" id="current-progress" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 分隔线 -->
    <div class="splitter" id="splitter" title="拖拽调节宽度">
      <span class="splitter__grip"></span>
    </div>

    <!-- 右栏：科目列表 -->
    <section class="pane pane-right">
      <header class="toolbar">
        <h1 class="toolbar__title"><span data-lang="zh">科目列表</span> <span class="toolbar__sub"
            data-lang="en">SUBJECTS</span></h1>
        <div class="toolbar__controls">
          <div class="lang-opts" id="lang-opts">
            <label class="ak-choice ak-choice--checkbox">
              <input class="ak-choice__input" type="checkbox" id="opt-hide-en">
              <span class="ak-choice__label">隐藏英文</span>
            </label>
            <label class="ak-choice ak-choice--checkbox">
              <input class="ak-choice__input" type="checkbox" id="opt-hide-zh">
              <span class="ak-choice__label">隐藏中文</span>
            </label>
          </div>
          <div class="ak-button-group">
            <button class="tool-btn" type="button" id="btn-theme" title="切换亮/暗主题">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a9 9 0 1 0 9 9h-9V3z" />
              </svg>
            </button>
            <button class="tool-btn" type="button" id="btn-edit" title="编辑科目列表">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
              </svg>
            </button>
            <button class="tool-btn" type="button" id="btn-lock" title="锁定/解锁界面">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path id="btn-lock-icon"
                  d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <div class="subject-list" id="subject-list" role="list"></div>
      <div class="list-empty" id="list-empty" hidden>暂无科目，点击右上角「编辑」添加。</div>
    </section>
  </main>

  <!-- 编辑科目对话框 -->
  <dialog class="ak-dialog editor-dialog" id="editor-dialog" aria-labelledby="editor-title">
    <header class="ak-dialog__header">
      <span class="ak-dialog__eyebrow">EXAM / EDITOR</span>
      <h2 class="ak-dialog__title" id="editor-title">编辑科目列表</h2>
    </header>
    <div class="ak-dialog__body">
      <div class="editor-table">
        <div class="editor-head">
          <span class="ak-label">科目名</span>
          <span class="ak-label">开始日期</span>
          <span class="ak-label">开始时间</span>
          <span class="ak-label">结束日期</span>
          <span class="ak-label">结束时间</span>
          <span class="ak-label">时长</span>
          <span class="ak-label">操作</span>
        </div>
        <div id="editor-rows"></div>
      </div>
      <button class="ak-button" type="button" id="btn-add-row">
        <span class="ak-button__label">+ 添加科目</span>
      </button>
      <div class="scale-section">
        <span class="ak-label">字号调节 / TYPE SCALE</span>
        <div class="scale-rows" id="scale-rows"></div>
      </div>
    </div>
    <form class="ak-dialog__footer" method="dialog" id="editor-footer">
      <button class="ak-button" value="cancel">
        <span class="ak-button__label">取消</span>
      </button>
      <button class="ak-button ak-button--action" value="save" id="btn-save">
        <span class="ak-button__label">保存</span>
      </button>
    </form>
  </dialog>

  <!-- 数据来源选择对话框 -->
  <dialog class="ak-dialog" id="source-dialog" aria-labelledby="source-title">
    <header class="ak-dialog__header">
      <span class="ak-dialog__eyebrow">EXAM / DATA SOURCE</span>
      <h2 class="ak-dialog__title" id="source-title">检测到两份课表数据</h2>
    </header>
    <div class="ak-dialog__body">
      <p>本地目录下的 <code>schedule.json</code> 与应用缓存中的课表内容不一致，请选择要使用的一份：</p>
    </div>
    <form class="ak-dialog__footer" method="dialog">
      <button class="ak-button" value="cache">
        <span class="ak-button__label">使用缓存</span>
      </button>
      <button class="ak-button ak-button--action" value="file">
        <span class="ak-button__label">使用 schedule.json</span>
      </button>
    </form>
  </dialog>

  <!-- 通知 -->
  <div class="ak-notice-stack notice-stack" id="notice-stack"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
